name: Installer

# What the Checks workflow's dry runs cannot do: the wheel, other Linux distributions, and macOS
# in the public release repo. Nothing here installs Bridge, stores credentials or starts
# services: every installer call uses --dry-run, and the containers only add Python and the
# tools the plan probes. The containers go through the service preflight without systemd (the
# plan says so and sets up none), with --skip-credentials: secret-tool cannot show there that no
# credential is stored yet, and the plan stops rather than store over one it cannot see.
# The wheel job alone applies the installer, against stand-ins in a scratch HOME.
# Hosted-runner billing may block these jobs; docs/install.md describes UTM VMs as
# the manual fallback. docs/ci.md says what runs when: in the public release repo on a pull
# request to main that changes the paths below, and in every Full run, every night and on a tag;
# in the private dev repo only by hand, so run it there on a branch that changes them, or
# `make wheel-smoke` locally. A pull request's macOS job in Checks runs the wheel smoke too.

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/install*"
      - scripts/wheel_smoke.py
      - "src/proton_mail_mcp/installer/**"
      - src/proton_mail_mcp/cli.py
      - src/proton_mail_mcp/config.py
      - src/proton_mail_mcp/connect.py
      - src/proton_mail_mcp/credential_store.py
      - src/proton_mail_mcp/localfs.py
      - src/proton_mail_mcp/service_entry.py
      - "examples/**"
      - "tests/test_installer_*.py"
      - tests/test_cli_dispatch.py
      - tests/test_credential_store.py
      - tests/test_service_entry.py
      - pyproject.toml
      - .github/workflows/installer.yml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Only a newer push to the same pull request cancels a run; the nightly, tags and runs by hand
# never cancel. In a called run github.workflow is the caller's name.
concurrency:
  group: installer-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  INSTALLER_TESTS: >-
    tests/test_installer_detect.py tests/test_installer_plan.py
    tests/test_installer_execute.py tests/test_installer_cli.py
    tests/test_installer_upgrade.py tests/test_installer_setup.py tests/test_cli_dispatch.py
    tests/test_credential_store.py tests/test_service_entry.py
  CI_BRIDGE_USER: ci-bridge-user@example.invalid

jobs:
  wheel:
    # Builds the wheel and runs the quick start from it with stand-ins for systemctl,
    # secret-tool and Bridge: no unit, keyring or Bridge is touched, and nothing is uploaded.
    # The private dev repo runs these by hand only, directly or from a Full run started by hand.
    if: github.event_name == 'workflow_dispatch' || (github.repository == 'legalaspro/proton-mail-mcp' && (github.event.repository.visibility == 'public' || vars.FREE_MINUTES == 'true'))
    name: Wheel smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.repository == 'legalaspro/proton-mail-mcp' && (github.event.repository.visibility == 'public' || vars.FREE_MINUTES == 'true') && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.13.6
      - run: python scripts/wheel_smoke.py --python 3.12

  rpm-family:
    if: github.event_name == 'workflow_dispatch' || (github.repository == 'legalaspro/proton-mail-mcp' && (github.event.repository.visibility == 'public' || vars.FREE_MINUTES == 'true'))
    name: ${{ matrix.image }} (dry run)
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: fedora:latest
            python: python3
          - image: almalinux:9
            python: python3.12
    steps:
      - run: dnf -y install ${{ matrix.python }} ${{ matrix.python }}-pip git libsecret gnupg2 util-linux shadow-utils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ${{ matrix.python }} -m venv /opt/venv && /opt/venv/bin/python -m pip install -e '.[dev]'
      - run: |
          # shellcheck disable=SC2086 # One argument per test file.
          /opt/venv/bin/python -m pytest -q -p no:cacheprovider $INSTALLER_TESTS
      - name: Dry run as an unprivileged user (the installer refuses root)
        shell: bash
        run: |
          useradd -m ci
          as_ci() { runuser -u ci -- env PMM_PYTHON=/opt/venv/bin/python bash scripts/install.sh "$@"; }
          as_ci detect
          # The container runs no systemd: the preflight must say so and plan no unit.
          output="$(as_ci install --dry-run --skip-credentials --bridge-user "$CI_BRIDGE_USER")"
          printf '%s\n' "$output"
          grep -q "so the installer sets up no service, as with --skip-services" <<<"$output"
          if grep -q "systemctl --user" <<<"$output"; then echo "a unit was planned" >&2; exit 1; fi
          output="$(as_ci uninstall --dry-run)"
          printf '%s\n' "$output"
          grep -q "so only files are removed" <<<"$output"

  arch:
    if: github.event_name == 'workflow_dispatch' || (github.repository == 'legalaspro/proton-mail-mcp' && (github.event.repository.visibility == 'public' || vars.FREE_MINUTES == 'true'))
    name: Arch Linux (dry run)
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 10
    steps:
      - run: pacman -Syu --noconfirm python git libsecret gnupg util-linux
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python -m venv /opt/venv && /opt/venv/bin/python -m pip install -e '.[dev]'
      - run: |
          # shellcheck disable=SC2086 # One argument per test file.
          /opt/venv/bin/python -m pytest -q -p no:cacheprovider $INSTALLER_TESTS
      - name: Dry run as an unprivileged user (the installer refuses root)
        shell: bash
        run: |
          useradd -m ci
          as_ci() { runuser -u ci -- env PMM_PYTHON=/opt/venv/bin/python bash scripts/install.sh "$@"; }
          as_ci detect
          # The container runs no systemd: the preflight must say so and plan no unit.
          output="$(as_ci install --dry-run --skip-credentials --bridge-user "$CI_BRIDGE_USER")"
          printf '%s\n' "$output"
          grep -q "so the installer sets up no service, as with --skip-services" <<<"$output"
          if grep -q "systemctl --user" <<<"$output"; then echo "a unit was planned" >&2; exit 1; fi
          output="$(as_ci uninstall --dry-run)"
          printf '%s\n' "$output"
          grep -q "so only files are removed" <<<"$output"

  macos:
    name: macOS (dry run)
    if: github.repository == 'legalaspro/proton-mail-mcp' && (github.event.repository.visibility == 'public' || vars.FREE_MINUTES == 'true')
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv pip install --system -e ".[dev]"
      - run: |
          # shellcheck disable=SC2086 # One argument per test file.
          python -m pytest -q -p no:cacheprovider $INSTALLER_TESTS
      # /bin/bash is bash 3.2 on macOS; the script must stay compatible with it.
      - run: /bin/bash -n scripts/install.sh
      - run: PMM_PYTHON="$(command -v python)" /bin/bash scripts/install.sh detect --json
      - run: PMM_PYTHON="$(command -v python)" /bin/bash scripts/install.sh install --dry-run --bridge-user "$CI_BRIDGE_USER"
      - run: PMM_PYTHON="$(command -v python)" /bin/bash scripts/install.sh uninstall --dry-run
