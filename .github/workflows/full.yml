name: Full run

# Every Python and test, plus the installer workflow. The private dev repo pays for every minute,
# so there it runs only by hand, on Linux and Windows. The public release repo runs it on its
# own too, because minutes are free there: every night and on a tag, on Linux, Windows and macOS
# and every Python. A pull request runs none of it: Checks runs the pull request's three jobs, and
# the installer workflow runs when its paths change. See docs/ci.md.

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Only a newer push to the same pull request would cancel a run, and no pull request starts this
# one: tags, the nightly run and runs by hand never cancel.
concurrency:
  group: full-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    # GitHub may send a schedule event without the repository's visibility, so the release repo
    # also sets its FREE_MINUTES variable to true, which keeps the nightly. See docs/ci.md.
    if: github.event_name == 'workflow_dispatch' || (github.repository == 'legalaspro/proton-mail-mcp' && (github.event.repository.visibility == 'public' || vars.FREE_MINUTES == 'true'))
    strategy:
      fail-fast: false
      # A run by hand in a private repo: the oldest and newest supported Python.
      matrix:
        python: ${{ fromJSON(github.repository == 'legalaspro/proton-mail-mcp' && (github.event.repository.visibility == 'public' || vars.FREE_MINUTES == 'true') && '["3.12", "3.13", "3.14"]' || '["3.12", "3.14"]') }}
    uses: ./.github/workflows/check.yml
    with:
      python-version: ${{ matrix.python }}
      full: true

  installer:
    if: github.event_name == 'workflow_dispatch' || (github.repository == 'legalaspro/proton-mail-mcp' && (github.event.repository.visibility == 'public' || vars.FREE_MINUTES == 'true'))
    uses: ./.github/workflows/installer.yml
